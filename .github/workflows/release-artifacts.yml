name: StageMesh Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install release tooling
        run: python -m pip install -r requirements-release.txt
      - name: Configure and build Release engine
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTAGEMESH_BUILD_TESTS=ON -DSTAGEMESH_RT_QUALIFICATION=ON
      - name: Run native tests
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Stage install tree
        run: |
          mkdir -p dist/rootfs
          DESTDIR="$PWD/dist/rootfs" STAGEMESH_BUILD_DIR="$PWD/build" ./scripts/install-linux.sh
      - name: Create archive and checksums
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist/rootfs -czf dist/stagemesh-linux.tar.gz .
          sha256sum dist/stagemesh-linux.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stagemesh-linux-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
