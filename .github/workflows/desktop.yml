name: StageMesh Desktop

on:
  pull_request:
    paths:
      - "backend/**"
      - "CMakeLists.txt"
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - "docs/desktop-runtime.md"
      - "PROJECT_MASTER.md"
      - "requirements-desktop.txt"
      - "scripts/build-desktop-runtime.py"
      - "scripts/desktop-artifact-manifest.py"
      - "scripts/desktop-dependency-inventory.py"
      - "scripts/desktop-release-readiness.py"
      - "scripts/desktop-windows-channel.py"
      - "scripts/desktop-release-index.py"
      - "scripts/desktop-clean-host-review.py"
      - "scripts/desktop-sbom.py"
      - "scripts/desktop-signing-readiness.py"
      - "scripts/desktop-signing-verification.py"
      - "scripts/verify-desktop-download.py"
      - "scripts/posix-desktop-clean-host.py"
      - "scripts/windows-desktop-clean-host.py"
      - "scripts/desktop-runtime-smoke.py"
      - "docs/desktop-release-readiness.md"
      - "tests/test_desktop_artifact_manifest.py"
      - "tests/test_desktop_dependency_inventory.py"
      - "tests/test_desktop_release_readiness.py"
      - "tests/test_desktop_windows_channel.py"
      - "tests/test_desktop_release_index.py"
      - "tests/test_desktop_clean_host_review.py"
      - "tests/test_desktop_sbom.py"
      - "tests/test_desktop_signing_readiness.py"
      - "tests/test_desktop_signing_verification.py"
      - "tests/test_desktop_download_verifier.py"
      - "tests/test_desktop_version.py"
      - "tests/test_posix_desktop_clean_host.py"
      - "tests/test_windows_desktop_clean_host.py"
      - "scripts/verify-desktop-version.py"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "backend/**"
      - "CMakeLists.txt"
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - "docs/desktop-runtime.md"
      - "PROJECT_MASTER.md"
      - "requirements-desktop.txt"
      - "scripts/build-desktop-runtime.py"
      - "scripts/desktop-artifact-manifest.py"
      - "scripts/desktop-dependency-inventory.py"
      - "scripts/desktop-release-readiness.py"
      - "scripts/desktop-windows-channel.py"
      - "scripts/desktop-release-index.py"
      - "scripts/desktop-clean-host-review.py"
      - "scripts/desktop-sbom.py"
      - "scripts/desktop-signing-readiness.py"
      - "scripts/desktop-signing-verification.py"
      - "scripts/verify-desktop-download.py"
      - "scripts/posix-desktop-clean-host.py"
      - "scripts/windows-desktop-clean-host.py"
      - "scripts/desktop-runtime-smoke.py"
      - "docs/desktop-release-readiness.md"
      - "tests/test_desktop_artifact_manifest.py"
      - "tests/test_desktop_dependency_inventory.py"
      - "tests/test_desktop_release_readiness.py"
      - "tests/test_desktop_windows_channel.py"
      - "tests/test_desktop_release_index.py"
      - "tests/test_desktop_clean_host_review.py"
      - "tests/test_desktop_sbom.py"
      - "tests/test_desktop_signing_readiness.py"
      - "tests/test_desktop_signing_verification.py"
      - "tests/test_desktop_download_verifier.py"
      - "tests/test_desktop_version.py"
      - "tests/test_posix_desktop_clean_host.py"
      - "tests/test_windows_desktop_clean_host.py"
      - "scripts/verify-desktop-version.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Only superseded PR revisions share a group. Main/manual runs retain unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build desktop package (${{ matrix.os }} / ${{ matrix.distribution_channel }})
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            native_engine: build-desktop-native/native/stagemesh_engine
            binary_suffix: ""
            distribution_channel: standard
          - os: macos-14
            native_engine: build-desktop-native/native/stagemesh_engine
            binary_suffix: ""
            distribution_channel: standard
          - os: windows-2022
            native_engine: build-desktop-native/native/Release/stagemesh_engine.exe
            binary_suffix: .exe
            distribution_channel: online
          - os: windows-2022
            native_engine: build-desktop-native/native/Release/stagemesh_engine.exe
            binary_suffix: .exe
            distribution_channel: offline

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Verify pinned desktop Rust dependencies
        run: >-
          cargo metadata
          --manifest-path desktop/src-tauri/Cargo.toml
          --locked
          --format-version 1
          --no-deps

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify desktop release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/verify-desktop-version.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify-desktop-version.py --tag "v$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          fi

      - name: Resolve Rust host target
        shell: bash
        run: |
          echo "TAURI_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build native engine
        run: |
          cmake -S . -B build-desktop-native -DCMAKE_BUILD_TYPE=Release -DSTAGEMESH_BUILD_TESTS=OFF
          cmake --build build-desktop-native --config Release --parallel 2

      - name: Build bundled runtime sidecars
        run: |
          python -m pip install -r requirements-desktop.txt
          python scripts/build-desktop-runtime.py --target "${{ env.TAURI_TARGET }}" --native-engine "${{ matrix.native_engine }}"

      - name: Verify bundled runtime handshake
        run: >-
          python scripts/desktop-runtime-smoke.py
          --runtime "desktop/src-tauri/binaries/stagemesh-runtime-${{ env.TAURI_TARGET }}${{ matrix.binary_suffix }}"
          --native-engine "desktop/src-tauri/binaries/stagemesh_engine-${{ env.TAURI_TARGET }}${{ matrix.binary_suffix }}"
          --frontend frontend

      - name: Generate platform icons
        working-directory: desktop
        run: npm run tauri icon src-tauri/icons/stagemesh.svg

      - name: Configure Windows distribution channel
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python scripts/desktop-windows-channel.py
          --channel "${{ matrix.distribution_channel }}"

      - name: Build and package desktop application
        working-directory: desktop
        run: npm run tauri build

      - name: Record platform signing readiness
        shell: bash
        env:
          STAGEMESH_WINDOWS_SIGNING_MODE: ${{ vars.STAGEMESH_WINDOWS_SIGNING_MODE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          STAGEMESH_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.STAGEMESH_WINDOWS_CERTIFICATE_THUMBPRINT }}
          STAGEMESH_WINDOWS_TIMESTAMP_URL: ${{ vars.STAGEMESH_WINDOWS_TIMESTAMP_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STAGEMESH_WINDOWS_SIGNING_ENDPOINT: ${{ vars.STAGEMESH_WINDOWS_SIGNING_ENDPOINT }}
          STAGEMESH_WINDOWS_SIGNING_ACCOUNT: ${{ vars.STAGEMESH_WINDOWS_SIGNING_ACCOUNT }}
          STAGEMESH_WINDOWS_SIGNING_PROFILE: ${{ vars.STAGEMESH_WINDOWS_SIGNING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ vars.APPLE_API_KEY_PATH }}
          API_PRIVATE_KEYS_DIR: ${{ vars.API_PRIVATE_KEYS_DIR }}
        run: >-
          python scripts/desktop-signing-readiness.py
          --platform "${{ runner.os }}"
          --distribution-channel "${{ matrix.distribution_channel }}"
          --output desktop/src-tauri/target/release/bundle/signing-readiness.json

      - name: Record locked desktop dependency inventory
        shell: bash
        run: >-
          python scripts/desktop-dependency-inventory.py
          --output desktop/src-tauri/target/release/bundle/desktop-dependencies.json
          --commit "$GITHUB_SHA"
          --version "$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"

      - name: Generate CycloneDX desktop SBOM
        shell: bash
        run: >-
          python scripts/desktop-sbom.py
          --inventory desktop/src-tauri/target/release/bundle/desktop-dependencies.json
          --output desktop/src-tauri/target/release/bundle/desktop-sbom.cdx.json

      - name: Include offline download verifier
        shell: bash
        run: >-
          cp scripts/verify-desktop-download.py
          desktop/src-tauri/target/release/bundle/verify-download.py

      - name: Include cross-platform clean-host evidence reviewer
        shell: bash
        run: >-
          cp scripts/desktop-clean-host-review.py
          desktop/src-tauri/target/release/bundle/review-clean-host.py

      - name: Include Windows clean-host evidence collector
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cp scripts/windows-desktop-clean-host.py
          desktop/src-tauri/target/release/bundle/windows-clean-host.py

      - name: Include macOS/Linux clean-host evidence collector
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cp scripts/posix-desktop-clean-host.py
          desktop/src-tauri/target/release/bundle/posix-clean-host.py

      - name: Record installer checksums and qualification boundary
        shell: bash
        run: >-
          python scripts/desktop-artifact-manifest.py
          --directory desktop/src-tauri/target/release/bundle
          --platform "${{ runner.os }}"
          --distribution-channel "${{ matrix.distribution_channel }}"
          --commit "$GITHUB_SHA"
          --version "$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"

      - name: Verify exact artifact signatures when configured
        shell: bash
        env:
          STAGEMESH_SIGNING_VERIFICATION_MODE: ${{ vars.STAGEMESH_SIGNING_VERIFICATION_MODE }}
          STAGEMESH_SIGNTOOL_PATH: ${{ vars.STAGEMESH_SIGNTOOL_PATH }}
        run: >-
          python scripts/desktop-signing-verification.py
          --platform "${{ runner.os }}"
          --manifest desktop/src-tauri/target/release/bundle/desktop-artifacts.json
          --directory desktop/src-tauri/target/release/bundle
          --output desktop/src-tauri/target/release/bundle/signing-verification.json

      - name: Verify desktop release readiness boundary
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          fi
          python scripts/desktop-release-readiness.py \
            --tag "$release_tag" \
            --manifest desktop/src-tauri/target/release/bundle/desktop-artifacts.json \
            --dependency-inventory desktop/src-tauri/target/release/bundle/desktop-dependencies.json \
            --sbom desktop/src-tauri/target/release/bundle/desktop-sbom.cdx.json

      - name: Verify complete downloadable bundle
        shell: bash
        run: >-
          python scripts/verify-desktop-download.py
          --directory desktop/src-tauri/target/release/bundle

      - name: Attest desktop bundle provenance and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: desktop/src-tauri/target/release/bundle/SHA256SUMS
          sbom-path: desktop/src-tauri/target/release/bundle/desktop-sbom.cdx.json

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stagemesh-desktop-${{ matrix.os }}-${{ matrix.distribution_channel }}
          path: desktop/src-tauri/target/release/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  release-candidate:
    name: Bind cross-platform release candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download exact platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stagemesh-desktop-*
          path: release-candidate

      - name: Verify and bind Windows online/offline, macOS, and Linux bundles
        shell: bash
        run: >-
          python scripts/desktop-release-index.py
          --directory release-candidate
          --version "$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          --commit "$GITHUB_SHA"
          --output desktop-release-index.json

      - name: Attest release-candidate index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: desktop-release-index.json

      - name: Upload release-candidate index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stagemesh-desktop-release-index-${{ github.sha }}
          path: desktop-release-index.json
          if-no-files-found: error
          retention-days: 90
