name: StageMesh Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Generate platform icons
        working-directory: desktop
        run: npm run tauri icon src-tauri/icons/stagemesh.svg

      - name: Build and package desktop application
        working-directory: desktop
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stagemesh-desktop-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 90
