name: StageMesh Desktop

on:
  pull_request:
    paths:
      - "backend/**"
      - "CMakeLists.txt"
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - "docs/desktop-runtime.md"
      - "requirements-desktop.txt"
      - "scripts/build-desktop-runtime.py"
      - "scripts/desktop-artifact-manifest.py"
      - "scripts/desktop-runtime-smoke.py"
      - "tests/test_desktop_artifact_manifest.py"
      - "tests/test_desktop_version.py"
      - "scripts/verify-desktop-version.py"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "backend/**"
      - "CMakeLists.txt"
      - "desktop/**"
      - "frontend/**"
      - "native/**"
      - "docs/desktop-installation.md"
      - "docs/desktop-runtime.md"
      - "requirements-desktop.txt"
      - "scripts/build-desktop-runtime.py"
      - "scripts/desktop-artifact-manifest.py"
      - "scripts/desktop-runtime-smoke.py"
      - "tests/test_desktop_artifact_manifest.py"
      - "tests/test_desktop_version.py"
      - "scripts/verify-desktop-version.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            native_engine: build-desktop-native/native/stagemesh_engine
            binary_suffix: ""
          - os: macos-14
            native_engine: build-desktop-native/native/stagemesh_engine
            binary_suffix: ""
          - os: windows-2022
            native_engine: build-desktop-native/native/Release/stagemesh_engine.exe
            binary_suffix: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify pinned desktop Rust dependencies
        run: >-
          cargo metadata
          --manifest-path desktop/src-tauri/Cargo.toml
          --locked
          --format-version 1
          --no-deps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/verify-desktop-version.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify-desktop-version.py --tag "v$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          fi

      - name: Resolve Rust host target
        shell: bash
        run: |
          echo "TAURI_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build native engine
        run: |
          cmake -S . -B build-desktop-native -DCMAKE_BUILD_TYPE=Release -DSTAGEMESH_BUILD_TESTS=OFF
          cmake --build build-desktop-native --config Release --parallel 2

      - name: Build bundled runtime sidecars
        run: |
          python -m pip install -r requirements-desktop.txt
          python scripts/build-desktop-runtime.py --target "${{ env.TAURI_TARGET }}" --native-engine "${{ matrix.native_engine }}"

      - name: Verify bundled runtime handshake
        run: >-
          python scripts/desktop-runtime-smoke.py
          --runtime "desktop/src-tauri/binaries/stagemesh-runtime-${{ env.TAURI_TARGET }}${{ matrix.binary_suffix }}"
          --native-engine "desktop/src-tauri/binaries/stagemesh_engine-${{ env.TAURI_TARGET }}${{ matrix.binary_suffix }}"
          --frontend frontend

      - name: Generate platform icons
        working-directory: desktop
        run: npm run tauri icon src-tauri/icons/stagemesh.svg

      - name: Build and package desktop application
        working-directory: desktop
        run: npm run tauri build

      - name: Record installer checksums and qualification boundary
        shell: bash
        run: >-
          python scripts/desktop-artifact-manifest.py
          --directory desktop/src-tauri/target/release/bundle
          --platform "${{ runner.os }}"
          --commit "$GITHUB_SHA"
          --version "$(python -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stagemesh-desktop-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 90
