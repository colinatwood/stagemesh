name: StageMesh Platform Modules

on:
  pull_request:
  workflow_dispatch:

# Only superseded PR revisions share a group. Main/manual runs retain unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  platform-smoke:
    name: ${{ matrix.name }} platform smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: stagemesh-module-linux
          - os: windows-latest
            name: Windows x64
            artifact: stagemesh-module-windows
          - os: macos-14
            name: macOS Apple Silicon
            artifact: stagemesh-module-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run exact platform module smoke
        shell: bash
        env:
          STAGEMESH_CI_EVIDENCE: platform-module-smoke.json
        run: python ci/platform_snapshot_smoke.py
      - name: Run Windows SCM lifecycle smoke
        if: runner.os == 'Windows'
        shell: bash
        run: python ci/windows_service_smoke.py --evidence windows-service-smoke.json
      - name: Run native launch-binding smoke
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        env:
          STAGEMESH_LAUNCH_EVIDENCE: platform-launch-binding-smoke.json
        run: python ci/platform_launch_binding_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            platform-module-smoke.json
            windows-service-smoke.json
            platform-launch-binding-smoke.json
          if-no-files-found: error
          retention-days: 30
