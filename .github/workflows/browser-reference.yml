name: StageMesh Browser Reference

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/stagemesh-browser-qualification.py"
      - "requirements-browser.txt"
      - "tests/stage_placement_browser.py"
      - "tests/setup_workspace_browser.py"
      - ".github/workflows/browser-reference.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/stagemesh-browser-qualification.py"
      - "requirements-browser.txt"
      - "tests/stage_placement_browser.py"
      - "tests/setup_workspace_browser.py"
      - ".github/workflows/browser-reference.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-reference:
    name: Rendered workspace and accessibility reference
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install rendered-browser tooling
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Qualify the production workspace without physical outputs
        shell: bash
        run: |
          stagemesh_chromium="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/stagemesh-browser-qualification.py --chromium "$stagemesh_chromium" --screenshots browser-reference --output browser-reference/report.json
      - name: Exercise stage placement in Chromium
        run: python tests/stage_placement_browser.py
      - name: Exercise guided setup and workspace menus in Chromium
        run: python tests/setup_workspace_browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stagemesh-browser-reference-${{ github.sha }}
          path: browser-reference/
          if-no-files-found: ignore
