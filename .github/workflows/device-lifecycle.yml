name: StageMesh Native Device Lifecycle
on:
  pull_request:
  workflow_dispatch:
# Only superseded PR revisions share a group. Main/manual runs retain unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      STAGEMESH_ALLOW_SILENT_ENDPOINT_TEST: 1
      STAGEMESH_ALLOW_ENDPOINT_CAPTURE_TEST: 1
      STAGEMESH_ALLOW_UNAVAILABLE_NATIVE_MIDI: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Configure Windows native device library
        if: runner.os == 'Windows'
        run: cmake -S native -B build
      - name: Configure macOS native device library with ASan
        if: runner.os == 'macOS'
        run: cmake -S native -B build -DSTAGEMESH_DEVICE_ASAN=ON
      - name: Build native device library
        run: cmake --build build --config Release
      - name: Record qualification availability without requesting capture access
        run: python ci/qualification_availability.py
      - name: Test native lifecycle, execution fence and audio preflight
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Test native lifecycle without unavailable hosted macOS endpoint streams
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release -E '^(native_playback|native_capture)$' --output-on-failure
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows lifecycle evidence
        if: runner.os == 'Windows'
        run: python ci/device_lifecycle_evidence.py build/Release/device_lifecycle_smoke.exe
      - name: Record macOS lifecycle evidence
        if: runner.os == 'macOS'
        run: python ci/device_lifecycle_evidence.py build/device_lifecycle_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows execution-fence evidence
        if: runner.os == 'Windows'
        run: python ci/device_fence_evidence.py build/Release/device_execution_fence_smoke.exe
      - name: Record macOS execution-fence evidence
        if: runner.os == 'macOS'
        run: python ci/device_fence_evidence.py build/device_execution_fence_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows audio-preflight evidence
        if: runner.os == 'Windows'
        run: python ci/audio_preflight_evidence.py build/Release/audio_preflight_smoke.exe
      - name: Record macOS audio-preflight evidence
        if: runner.os == 'macOS'
        run: python ci/audio_preflight_evidence.py build/audio_preflight_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows stream-lifecycle evidence
        if: runner.os == 'Windows'
        run: python ci/audio_stream_evidence.py build/Release/audio_stream_lifecycle_smoke.exe
      - name: Record macOS stream-lifecycle evidence
        if: runner.os == 'macOS'
        run: python ci/audio_stream_evidence.py build/audio_stream_lifecycle_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows native playback evidence
        if: runner.os == 'Windows'
        run: python ci/native_playback_evidence.py build/Release/native_playback_smoke.exe
      - name: Record macOS native playback evidence
        if: runner.os == 'macOS'
        run: python ci/native_playback_evidence.py build/native_playback_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows native capture evidence
        if: runner.os == 'Windows'
        run: python ci/native_capture_evidence.py build/Release/native_capture_smoke.exe
      - name: Record macOS native capture evidence
        if: runner.os == 'macOS'
        run: python ci/native_capture_evidence.py build/native_capture_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - name: Record Windows selected-loss fixture availability
        if: runner.os == 'Windows'
        run: python ci/native_selected_loss_evidence.py build/Release/native_selected_loss_smoke.exe
      - name: Record macOS selected endpoint loss evidence
        if: runner.os == 'macOS'
        run: python ci/native_selected_loss_evidence.py build/native_selected_loss_smoke
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-lifecycle-${{ matrix.os }}
          path: |
            device-lifecycle-evidence.json
            device-fence-evidence.json
            audio-preflight-evidence.json
            audio-stream-lifecycle-evidence.json
            native-playback-evidence.json
            native-capture-evidence.json
            native-selected-loss-evidence.json
            qualification-availability.json
          if-no-files-found: warn
          retention-days: 30
